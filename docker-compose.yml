version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    internal: true
  monitoring-net:
    driver: bridge

volumes:
  db_data:
  grafana_data:

services:
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend-net
    depends_on:
      - app

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: student-app
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=student_user
      - DB_PASSWORD=Strong_Student_Pass2026!
      - DB_NAME=student_db
    networks:
      - frontend-net
      - backend-net
      - monitoring-net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSecurePassword2026!
      MYSQL_DATABASE: student_db
      MYSQL_USER: student_user
      MYSQL_PASSWORD: Strong_Student_Pass2026!
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-tool
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db

  # --- CÁC DỊCH VỤ GIÁM SÁT (COMMIT 2) ---
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "student_user:Strong_Student_Pass2026!@(db:3306)/student_db"
    networks:
      - backend-net
      - monitoring-net
    depends_on:
      - db

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring-net
