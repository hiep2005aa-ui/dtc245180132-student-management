version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    internal: true

volumes:
  db_data:

services:
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend-net
    depends_on:
      - app

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: student-app
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=student_user
      - DB_PASSWORD=Strong_Student_Pass2026!
      - DB_NAME=student_db
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSecurePassword2026!
      MYSQL_DATABASE: student_db
      MYSQL_USER: student_user
      MYSQL_PASSWORD: Strong_Student_Pass2026!
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-tool
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db
