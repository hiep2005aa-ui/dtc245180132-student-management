global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'student-app'
    static_configs:
      - targets: ['app:3000']

  - job_name: 'mysql-exporter'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
